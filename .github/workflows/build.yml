name: Build Windows app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TaskbarAudioVisualizer/TaskbarAudioVisualizer.csproj
      - name: Build
        run: dotnet build TaskbarAudioVisualizer/TaskbarAudioVisualizer.csproj --configuration Release --no-restore
